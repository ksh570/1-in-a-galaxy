<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleeping Explorers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#060a14;--card:rgba(14,22,38,.82);--ink:#e8edf5;--muted:#9eabbf;--soft:#6f7d92;--line:rgba(150,170,215,.2);--accent:#4b4fa8;--accent-h:#575cbd;--accent-ink:#a9adf5;--on-accent:#ffffff;--green:#3fae74;--gold:#e39a5b;--teal:#3cc7a8;--chip:rgba(255,255,255,.07);--c1:#25443f;--c2:#2f8a72;--c3:#4fd3b0;--off:rgba(255,255,255,.09);--tip:#e8edf5;--tipink:#0a0f1a;--top:rgba(6,10,20,.82);--field:rgba(255,255,255,.05)}
body.light{--bg:#e9edea;--card:#f4f6f4;--ink:#14202a;--muted:#5b6670;--soft:#8a949b;--line:#d3dad5;--accent:#4b4fa8;--accent-h:#3f4392;--accent-ink:#3c3f8f;--on-accent:#ffffff;--green:#2f7a4f;--gold:#b5652a;--teal:#1f6f5c;--chip:#e1e6e2;--c1:#b9d3c3;--c2:#6fa58a;--c3:#1f6f5c;--off:#cfd5d1;--tip:#14202a;--tipink:#f4f6f4;--top:#e9edea;--field:#e9edea}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body.light #sky{display:none}
html{background:#060a14}
body:not(.light){background:radial-gradient(ellipse at 15% 20%,rgba(90,60,160,.22),transparent 55%),radial-gradient(ellipse at 85% 75%,rgba(30,110,160,.18),transparent 55%),radial-gradient(ellipse at 60% 10%,rgba(110,100,230,.12),transparent 50%);background-attachment:fixed}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:"Noto Sans KR",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button{font-family:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.hidden{display:none!important}
#s-roll{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#roll-label{font-size:17px;color:var(--muted);font-weight:600;margin-bottom:6px}
#roll-word{text-shadow:0 0 40px rgba(140,170,255,.35);font-family:"Black Han Sans",Pretendard,sans-serif;font-size:clamp(56px,11vw,170px);line-height:1.1;color:var(--ink);min-height:1.15em}
#roll-prob{font-family:"IBM Plex Mono",monospace;font-size:19px;color:var(--muted);margin-top:14px;min-height:28px}
#resume{margin-top:28px;background:none;border:1px solid var(--line);padding:10px 18px;border-radius:6px;font-size:15px;cursor:pointer;color:var(--muted)}
#resume:hover{border-color:var(--ink);color:var(--ink)}
#s-card{padding:60px 20px}
.bc{max-width:1080px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bc-head{background:var(--accent);color:var(--on-accent);display:flex;justify-content:space-between;align-items:center;padding:22px 32px}
.bc-head b{font-size:26px;font-weight:700}
.bc-head span{font-family:"IBM Plex Mono",monospace;font-size:17px;opacity:.95}
.bc-body{padding:26px 32px 32px}
.lbl{font-size:15px;color:var(--muted);font-weight:600}
.bc-name{font-size:58px;font-weight:800;margin:4px 0 10px;letter-spacing:-1px}
.bc-intro{font-size:21px;line-height:1.75;color:var(--ink);opacity:.85;margin:0 0 22px}
.bc-note{font-size:17px;line-height:1.75;color:var(--muted);padding-bottom:12px;border-bottom:1px dashed var(--line);margin:0 0 30px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 30px;margin-bottom:34px}
.fields .v{font-size:21px;font-weight:700;margin-top:8px;line-height:1.5}
.cmp{border:1px dashed var(--line);padding:6px 22px 16px;margin-bottom:34px}
.cmp table{width:100%;border-collapse:collapse;font-size:18px}
.cmp th{font-weight:600;color:var(--muted);text-align:right;padding:14px 0;border-bottom:1px solid var(--line)}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:12px 0;border-bottom:1px solid var(--line);text-align:right;color:var(--muted)}
.cmp td:last-child{font-weight:700;color:var(--ink)}
.cmp p{font-size:16px;line-height:1.7;color:var(--muted);margin:14px 0 0}
.flist .row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:18px;gap:16px}
.flist .row b{font-weight:700}
.flist .row span{color:var(--muted);text-align:right}
.flist .row.link{cursor:pointer}
.flist .row.link:hover b{color:var(--accent)}
.bc-foot{font-size:17px;color:var(--muted);margin:16px 0 34px}
.bc-btns{display:flex;justify-content:flex-end;gap:16px}
.btn-o{background:var(--card);border:1px solid var(--line);padding:26px 28px;font-size:22px;border-radius:3px;cursor:pointer}
.btn-o:hover{border-color:var(--ink)}
.btn-p{background:var(--accent);color:var(--on-accent)!important;border:none;padding:26px 42px;font-size:26px;font-weight:800;border-radius:3px;cursor:pointer}
.btn-p:hover{background:var(--accent-h)}
#s-game{min-height:100vh}
.top{position:relative;z-index:20;background:var(--top);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:18px 30px 14px}
.top-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand{font-size:30px;font-weight:800;padding-bottom:8px}
.brand i{font-style:normal;color:var(--accent-ink);font-family:"Black Han Sans",sans-serif;font-weight:400}
.age{display:flex;align-items:baseline;gap:6px}
.age small{font-size:16px;color:var(--muted);font-weight:600;margin-right:4px}
.age b{font-size:62px;font-weight:800;line-height:.95}
.age em{font-style:normal;font-size:26px;font-weight:700}
.sub{font-size:19px;color:var(--muted);padding-bottom:10px}
.prog{height:5px;background:var(--line);margin:8px 0 16px;position:relative}
.prog div{position:absolute;left:0;top:0;bottom:0;background:var(--accent-ink);opacity:.75;width:0}
.ctrls{display:flex;gap:7px;flex-wrap:wrap;position:relative}
.cb{background:var(--card);border:1px solid var(--line);padding:13px 16px;font-size:19px;border-radius:3px;cursor:pointer;white-space:nowrap;line-height:1}
.cb:hover{border-color:var(--ink)}
.cb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cb.hl{outline:2px solid var(--accent-ink);outline-offset:-2px}
.tip{position:absolute;top:58px;left:0;background:var(--tip);color:var(--tipink);padding:16px 18px;font-size:17px;line-height:1.6;border-radius:3px;max-width:450px;z-index:30}
.menu{position:absolute;top:56px;right:0;background:var(--card);border:1px solid var(--line);min-width:220px;z-index:30;border-radius:3px}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:14px 18px;font-size:17px;cursor:pointer}
.menu button:last-child{border-bottom:none}
.menu button:hover{background:var(--chip)}
.grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.45fr) minmax(0,.95fr);gap:30px;padding:30px}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:3px}
.box-in{padding:22px 24px}
.box h3{font-size:25px;font-weight:800;margin:0 0 18px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.box h3 small{font-size:15px;color:var(--muted);font-weight:600}
.idh{background:var(--accent);color:var(--on-accent);display:flex;justify-content:space-between;padding:14px 22px;font-size:16px;font-weight:600;letter-spacing:1px}
.idh span:last-child{font-family:"IBM Plex Mono",monospace}
.idb{display:flex;gap:22px;padding:20px 20px 14px}
.idb img{width:110px;height:110px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;background:#05070a;border-radius:3px}
.idname{font-size:32px;font-weight:800;margin:0 0 8px}
.idt{font-size:17px;border-collapse:collapse}
.idt td{padding:4px 0;vertical-align:top}
.idt td:first-child{color:var(--muted);width:70px}
.mrz{border-top:1px solid var(--line);padding:16px 20px;font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--muted);letter-spacing:1px;white-space:pre;overflow:hidden}
.bar{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:12px;margin:14px 0;font-size:18px}
.bar .t{height:16px;background:var(--off)}
.bar .t div{height:100%;transition:width .5s}
.bar b{font-weight:500;text-align:right;font-family:"IBM Plex Mono",monospace}
.scene canvas{width:100%;display:block;image-rendering:pixelated;border-bottom:1px solid var(--line)}
.scene p{margin:0;padding:16px 22px;font-size:19px}
.focus .meta{font-size:18px;color:var(--muted);margin-bottom:12px}
.focus .txt{font-size:18px;line-height:1.8;color:var(--muted)}
.focus .q{font-size:20px;font-weight:700;margin:20px 0 6px;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;background:var(--field);border:1px solid var(--line);padding:14px 16px;font-size:18px;margin:10px 0;border-radius:3px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt.good{border:2px solid var(--green)}
.opt.bad{border:2px solid var(--accent-ink)}
.real{background:var(--chip);border-left:4px solid var(--green);padding:14px 16px;font-size:18px;line-height:1.7;margin-top:12px}
.go{margin-top:16px;background:var(--accent);color:var(--on-accent);border:none;padding:14px 22px;font-size:18px;font-weight:700;border-radius:3px;cursor:pointer}
.go.o{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.log .it{border-top:1px solid var(--line);padding:14px 0}
.log .it:first-child{border-top:none}
.log .d{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--soft)}
.log .h{font-size:18px;font-weight:700;margin:4px 0}
.log .x{font-size:16px;line-height:1.7;color:var(--muted)}
.log .tag{display:inline-block;font-size:13px;background:var(--chip);padding:2px 8px;margin-right:6px;border-radius:2px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:18px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right}
.fr{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:10px}
.fr:last-child{border-bottom:none}
.fr b{font-size:19px;display:block}
.fr small{font-size:15px;color:var(--muted)}
.fr span{font-size:16px;color:var(--muted);white-space:nowrap}
.fr.link{cursor:pointer}
.fr.link:hover b{color:var(--accent)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cells div{aspect-ratio:1;background:var(--off)}
.cells div.pl{outline:2px solid var(--ink);outline-offset:-2px}
.leg{font-size:15px;color:var(--muted);margin-top:14px;line-height:1.9}
.leg i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin:0 1px}
.src{font-size:15px;line-height:1.75;color:var(--muted);margin-top:14px}
.src a{color:var(--muted)}
.panel textarea{width:100%;min-height:90px;background:var(--field);color:var(--ink);border:1px solid var(--line);padding:12px;font-family:inherit;font-size:17px;border-radius:3px;resize:vertical}
.err{color:var(--accent-ink);font-size:15px;margin-top:6px;min-height:20px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tip);color:var(--tipink);padding:14px 20px;font-size:17px;border-radius:3px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
#totop{position:fixed;right:26px;bottom:26px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:16px 24px;font-size:18px;cursor:pointer;z-index:15}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.fields{grid-template-columns:1fr}.bc-name{font-size:42px}.bc-btns{flex-direction:column}.btn-o,.btn-p{padding:18px}.top{padding:14px}.grid{padding:14px}.cb{padding:11px 12px;font-size:16px}}
body.light{background:var(--bg)}
body.light #roll-word{text-shadow:none}
.box,.bc,.cb,.btn-o,#totop,.menu{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
body:not(.light) .bc-head,body:not(.light) .idh{border-bottom:1px solid rgba(169,173,245,.3)}
body:not(.light) .btn-p,body:not(.light) .go:not(.o){border:1px solid rgba(169,173,245,.4)!important}
.langseg{position:fixed;top:14px;right:16px;z-index:50;display:flex;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.langseg button{background:none;border:none;color:var(--muted);padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
.langseg button.on{background:var(--accent);color:var(--on-accent)}
#s-game .top{padding-right:170px}
#scene3d{width:100%;height:400px;display:block;border-bottom:1px solid var(--line);background:#05070a}
#scene3d canvas{display:block;width:100%!important;height:100%!important}
#scene.hidden3d{display:none}
.psub{font-size:16px;color:var(--muted);margin:-8px 0 12px}
.dexlink{margin-top:18px;background:none;border:1px solid var(--line);color:var(--muted);padding:9px 18px;border-radius:20px;font-size:15px;cursor:pointer}
.dexlink:hover{color:var(--ink);border-color:var(--accent-ink)}
#s-dex{padding:70px 20px 60px}
.dex{max-width:1080px;margin:0 auto}
.dex-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.dex-head h2{font-size:40px;font-weight:800;margin:0}
.dex-count{font-family:"IBM Plex Mono",monospace;font-size:24px;color:var(--accent-ink)}
.dex-bar{height:10px;background:var(--off);border-radius:6px;overflow:hidden;margin:14px 0 10px}
.dex-bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-ink));transition:width .8s}
.dex-goal{font-size:18px;color:var(--muted);margin:0 0 26px}
.dex-group{margin-bottom:28px}
.dex-group h3{font-size:22px;font-weight:700;margin:0 0 12px;display:flex;gap:10px;align-items:center}
.dex-group h3 small{font-size:15px;color:var(--muted);font-weight:500}
.dex-group h3 .done{font-size:13px;background:var(--accent);color:var(--on-accent);padding:3px 10px;border-radius:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--accent-ink)}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#05070a}
.tile .q{width:100%;aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--soft);font-family:"Black Han Sans",sans-serif}
.tile b{display:block;font-size:15px;margin-top:8px;line-height:1.3}
.tile small{display:block;font-size:13px;color:var(--accent-ink);margin-top:3px}
.tile.locked{cursor:default;opacity:.7}
.tile.locked:hover{transform:none;border-color:var(--line)}
.tile.new{border:2px solid var(--accent-ink)}
.dex-btns{display:flex;justify-content:flex-end;gap:16px;margin-top:20px}
.reveal{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 20px 30px;margin-bottom:34px;position:relative;overflow:hidden;animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.reveal::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,rgba(169,173,245,.18),transparent 30%);animation:spin 6s linear infinite;pointer-events:none}
.rv-new{display:inline-block;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px;padding:6px 16px;border-radius:20px;letter-spacing:1px;position:relative}
#rv-img{width:220px;height:220px;border-radius:50%;object-fit:cover;margin:18px auto 10px;display:block;border:4px solid var(--accent-ink);background:#05070a;position:relative}
.rv-title{font-family:"Black Han Sans",Pretendard,sans-serif;font-size:40px;color:var(--accent-ink);position:relative}
.rv-name{font-size:24px;font-weight:700;margin-top:4px;position:relative}
.rv-fact{font-size:18px;color:var(--muted);max-width:640px;margin:12px auto 0;line-height:1.7;position:relative}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(3,6,14,.7);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-in{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 34px;max-width:440px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.modal-star{font-size:46px;color:var(--accent-ink)}
.modal-in h3{font-size:26px;margin:6px 0 8px}
.modal-in p{font-size:17px;color:var(--muted);line-height:1.7;margin:0 0 6px}
.done-card{text-align:center}
.done-card .big{font-family:"Black Han Sans",sans-serif;font-size:34px;color:var(--accent-ink);margin:4px 0 6px}
@media(max-width:640px){#s-game .top{padding-right:14px;padding-top:58px}#scene3d{height:220px}.dex-head h2{font-size:30px}.rv-title{font-size:30px}}
.rank{margin:10px auto 14px;display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:14px 26px;border:1px solid var(--accent-ink);border-radius:12px;background:var(--chip)}
.rank small{font-size:14px;color:var(--muted)}
.rank b{font-size:24px;color:var(--ink)}
.rank span{font-size:15px;color:var(--muted)}
.rv-fact{white-space:pre-line}
.opt b{display:block;font-weight:600;font-size:18px}
.opt small{display:block;font-size:15px;color:var(--muted);margin-top:3px;line-height:1.5}
.glb-badge{position:absolute;bottom:12px;right:12px;font-size:12px!important;opacity:.8;background:rgba(5,8,16,.75);color:#e8edf5;font-size:13px;padding:6px 12px;border-radius:14px;border:1px solid rgba(169,173,245,.4);pointer-events:none}
.glb-badge.ok::before{content:"● ";color:#3fae74}
.glb-badge.load::before{content:"● ";color:#e3c27a}
.glb-badge.err{color:#ffb3b3;border-color:#ff8080}
.scene #scene-cap{display:none}
.drag-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(5,8,16,.72);color:#e8edf5;font-size:14px;padding:8px 16px;border-radius:18px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#scene3d{touch-action:none}
@keyframes shk{0%,100%{transform:translate(0,0)}15%{transform:translate(-14px,6px)}30%{transform:translate(12px,-8px)}45%{transform:translate(-10px,-4px)}60%{transform:translate(8px,6px)}75%{transform:translate(-5px,3px)}}
body.shake .grid,body.shake .top{animation:shk .5s cubic-bezier(.3,.7,.4,1)}
.boom-flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,240,200,.9),rgba(255,140,60,.35) 40%,transparent 70%);z-index:95;pointer-events:none;animation:fl .45s ease-out forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
.boom-cv{position:fixed;inset:0;z-index:96;pointer-events:none}
.focus.rebuild{animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
.boom-tag{display:inline-block;background:#ff5a3d;color:#fff;font-weight:800;font-size:15px;padding:5px 12px;border-radius:14px;margin-bottom:10px}
.tut-hl{position:absolute;z-index:80;border-radius:12px;box-shadow:0 0 0 9999px rgba(3,6,14,.72);border:2px solid var(--accent-ink);pointer-events:none;transition:all .3s}


.tut-txt{font-size:17px;line-height:1.6}
.tut-btns{display:flex;align-items:center;gap:10px;margin-top:14px}















.boom-flash.big{background:radial-gradient(circle,rgba(255,250,220,1),rgba(255,140,60,.5) 45%,rgba(120,20,0,.2) 75%,transparent);animation:fl .85s ease-out forwards}
body.shake #s-game{animation:shk .65s cubic-bezier(.3,.7,.4,1)}
#s-fail{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.fail{text-align:center;max-width:620px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.fail-badge{width:70px;height:70px;margin:0 auto 6px;border-radius:50%;background:#3a1416;border:2px solid #ff6b5a;color:#ff6b5a;font-size:34px;display:flex;align-items:center;justify-content:center}
.fail h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:64px;margin:10px 0 18px;color:#ff7a66}
#fail-img{width:170px;height:170px;object-fit:cover;border-radius:50%;filter:grayscale(.85) brightness(.75);border:3px solid #5a2a2a;background:#05070a}
.fail-name{font-size:24px;font-weight:700;margin:10px 0 14px}
.fail p{font-size:19px;line-height:1.7;color:var(--muted);margin:6px 0}
.fail-btns{display:flex;gap:14px;justify-content:center;margin:28px 0 14px;flex-wrap:wrap}
.fail small{font-size:14px;color:var(--soft)}
.tut-box{position:absolute;z-index:81;background:var(--tip);color:var(--tipink);border-radius:10px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .35s}
.tut-step{font-size:13px;opacity:.6;margin-bottom:6px;font-family:"IBM Plex Mono",monospace}
.tut-btns button{border:none;border-radius:6px;padding:9px 14px;font-size:15px;cursor:pointer;font-weight:600}
.tut-next{margin-left:auto;background:var(--accent);color:#fff}
.tut-skip{background:transparent;color:var(--tipink);opacity:.6}
.tut-wait{font-size:14px;color:var(--accent);font-weight:700}
.tut-block{position:fixed;inset:0;z-index:79;background:transparent;cursor:default}
#s-egg{padding:60px 20px 40px}
.egg{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.egg-head{text-align:center}
.egg-q{font-family:"Black Han Sans",sans-serif;font-size:64px;color:var(--accent-ink);line-height:1;text-shadow:0 0 30px rgba(169,173,245,.5);animation:eggq 2.4s ease-in-out infinite}
@keyframes eggq{50%{text-shadow:0 0 50px rgba(169,173,245,.9);transform:scale(1.04)}}
.egg-head h2{font-size:32px;margin:8px 0 6px}
.egg-head p{font-size:18px;color:var(--muted);margin:0 auto;max-width:760px;line-height:1.6}
.egg-scene{padding:0;overflow:hidden}
#egg3d{width:100%;height:460px;background:#020306}
#egg3d canvas{display:block;width:100%!important;height:100%!important}
.egg-meters{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.egg-meters .bar{grid-template-columns:70px 1fr 64px;margin:6px 0}
.egg-meters .bar .t div{transition:width .5s ease,background .3s}
.egg-meters .bar b{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:15px}
.egg-steps{display:flex;gap:4px;margin-bottom:12px}
.egg-steps span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.egg-steps span.gap{margin-left:8px}
.egg-steps span.d{background:var(--accent-ink)}
.egg-steps span.c{background:#fff;box-shadow:0 0 10px rgba(169,173,245,.9)}
.egg-prog{display:flex;justify-content:space-between;font-size:14px;color:var(--accent-ink);font-family:"IBM Plex Mono",monospace;margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
.egg-prog span{color:var(--muted)}
#egg-card h3{font-size:25px;margin:0 0 14px}
#egg-card .opt small{line-height:1.55}
.egg-cost{font-size:13px;font-weight:600;color:#e39a5b;margin-left:8px;white-space:nowrap;font-family:"IBM Plex Mono",monospace}
.egg-back1{margin-top:10px;font-size:14px!important;padding:8px 16px!important}
.egg-txt{font-size:17px;line-height:1.7;color:var(--muted)}
.egg-warn{color:#ff8a76;font-size:16px;margin:6px 0}
.egg-launch{font-size:22px!important;padding:16px 34px!important}
.egg-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px;justify-content:center}
.egg-chips span{font-size:13px;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.egg-chips i{font-style:normal;color:var(--soft);margin-right:6px}
.egg-log{list-style:none;padding:0;margin:0;font-size:17px;line-height:1.5}
.egg-log li{padding:8px 12px;border-left:3px solid var(--line);margin:6px 0;opacity:0;transform:translateX(-10px);transition:all .4s}
.egg-log li.in{opacity:1;transform:none}
.egg-log li.info{color:var(--muted)}
.egg-log li.ok{border-color:#3fae74;color:#9be8bd}
.egg-log li.warn{border-color:#e3c27a;color:#f0d79a}
.egg-log li.bad{border-color:#ff7a66;color:#ffab9c;font-weight:700}
.egg-end{text-align:center;margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.egg-grade{font-family:"Black Han Sans",sans-serif;font-size:96px;line-height:1;margin-bottom:4px}
.egg-endt{font-family:"Black Han Sans",sans-serif;font-size:44px;margin:0 0 8px}
.egg-end.success .egg-grade,.egg-end.success .egg-endt{color:#4fd3b0;text-shadow:0 0 30px rgba(79,211,176,.4)}
.egg-end.semi .egg-grade,.egg-end.semi .egg-endt{color:#e3c27a;text-shadow:0 0 30px rgba(227,194,122,.35)}
.egg-end.fail .egg-grade,.egg-end.fail .egg-endt{color:#ff7a66;text-shadow:0 0 30px rgba(255,122,102,.35)}
.egg-score{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:15px;margin-bottom:12px}
.egg-score b{color:var(--text,#fff);font-size:20px}
.egg-check{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.egg-check span{font-size:15px;padding:6px 12px;border-radius:14px;border:1px solid var(--line)}
.egg-check span.y{border-color:#3fae74;color:#7be0a8}
.egg-check span.y::before{content:"✓ "}
.egg-check span.n{color:var(--soft);text-decoration:line-through}
.egg-cause{font-size:17px;color:#ffab9c;font-weight:600}
.egg-real{text-align:left;margin:14px auto;max-width:720px;padding:14px 18px;border-radius:12px;background:rgba(75,79,168,.18);border:1px solid rgba(169,173,245,.35);font-size:16px;line-height:1.65}
.egg-real b{display:block;color:var(--accent-ink);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;font-family:"IBM Plex Mono",monospace}
@media(max-width:640px){#egg3d{height:300px}.egg-q{font-size:48px}.egg-meters{grid-template-columns:1fr}.egg-grade{font-size:72px}}
</style>
</head>

{v:'small',ko:'작은 안테나',en:'Small antenna',dk:'아주 가볍고 싸. 하지만 멀리 가면 신호가 거의 안 들려.',de:'Very light and cheap. But far away, the signal is barely heard.',c:1,m:0,s:-1,mis:{mars:2,europa:4},mt:{travel:.5,ops:1},b:['작은 안테나로는 지구까지 신호가 닿지 않았어','The small antenna could not reach Earth'],real:['갈릴레오 탐사선은 큰 안테나가 펴지지 않아서, 작은 안테나로 아주 조금씩 데이터를 보내야 했어.','The Galileo probe could not open its big antenna, so it had to send data very slowly through a small one.']}]},
{id:'cpu',ph:1,t:['컴퓨터','Computer'],ko:'어떤 컴퓨터를 넣을까?',en:'Which computer will it use?',o:[
{v:'rad',ko:'방사선에 강한 컴퓨터',en:'Radiation-hardened computer',dk:'옛날 기술이라 느려. 하지만 우주 방사선에도 끄떡없어.',de:'Old and slow. But space radiation cannot hurt it.',c:5,m:0,r:{travel:-.5},g:['튼튼한 컴퓨터가 방사선을 버텼어','The tough computer survived the radiation']},
{v:'fast',ko:'최신 일반 컴퓨터',en:'Newest regular computer',dk:'빠르고 싸고 똑똑해. 하지만 방사선에 약해.',de:'Fast, cheap and smart. But weak against radiation.',c:2,m:0,s:1,mis:{mars:.6,europa:3},mt:{travel:1,ops:.5},b:['방사선 때문에 컴퓨터가 고장 났어','Radiation broke the computer'],real:['목성 근처는 방사선이 아주 강해서, Juno는 전자 장비를 두꺼운 티타늄 상자 안에 넣었어.','Radiation near Jupiter is so strong that Juno keeps its electronics inside a thick titanium box.']},
{v:'dual',ko:'컴퓨터 2대 (예비용 포함)',en:'Two computers (with a backup)',dk:'하나가 고장 나면 다른 하나가 일해. 비싸고 조금 무거워.',de:'If one breaks, the other takes over. Costly and a bit heavier.',c:9,m:1,r:{travel:-1,ops:-1},g:['컴퓨터 하나가 멈췄지만, 예비 컴퓨터가 바로 일을 이어받았어','One computer stopped, but the backup took over right away']}]},
{id:'rocket',ph:2,t:['로켓','Rocket'],ko:'어떤 로켓에 실을까?',en:'Which rocket will carry it?',o:[
{v:'heavy',ko:'대형 로켓',en:'Heavy rocket',dk:'최대 16까지 실어. 믿을 만하지만 아주 비싸.',de:'Carries up to 16. Reliable, but very costly.',c:22,cap:16,r:{launch:-.3},g:['힘센 로켓이 여유 있게 하늘로 올라갔어','The powerful rocket climbed with power to spare']},
{v:'medium',ko:'중형 로켓',en:'Medium rocket',dk:'최대 11까지 실어. 오래 써 온 검증된 로켓이야.',de:'Carries up to 11. A proven rocket with a long record.',c:13,cap:11},
{v:'cheap',ko:'새로 나온 싼 로켓',en:'New budget rocket',dk:'최대 11까지 실어. 아주 싸지만, 아직 발사 기록이 적어.',de:'Carries up to 11. Very cheap, but it has few launches so far.',c:6,cap:11,r:{launch:2.5},b:['아직 검증이 덜 된 로켓에서 문제가 생겼어','The untested rocket had a problem'],real:['NASA의 OCO(2009)와 Glory(2011) 위성은 로켓의 덮개가 분리되지 않아서 둘 다 바다에 떨어졌어.','NASA satellites OCO (2009) and Glory (2011) were both lost because the rocket nose cover did not come off.']}]},
{id:'weather',ph:2,t:['날씨','Weather'],ko:'발사하는 날, 날씨가 애매해. 어떻게 할까?',en:'On launch day, the weather is uncertain. What now?',o:[
{v:'wait',ko:'완벽한 날씨를 기다리기',en:'Wait for perfect weather',dk:'안전해. 하지만 하루 미룰 때마다 많은 돈이 들어.',de:'Safe. But each day of delay costs a lot.',c:4,g:['날씨를 기다린 덕분에 맑은 하늘로 올라갔어','Waiting gave a clear sky for launch']},
{v:'wind',ko:'바람이 세도 발사',en:'Launch in strong wind',dk:'돈은 조금만 들어. 강한 바람이 로켓을 흔들 수 있어.',de:'Costs a little. Strong wind may shake the rocket.',c:1,r:{launch:1.2},b:['강한 바람에 로켓이 흔들렸어','Strong wind shook the rocket']},
{v:'cloud',ko:'구름이 많아도 정시 발사',en:'Launch on time under clouds',dk:'돈이 안 들고, 계획한 길로 딱 맞춰 출발해. 하지만 구름 속엔 번개가 있을 수 있어.',de:'Costs nothing and starts right on the planned path. But clouds can hide lightning.',c:0,r:{launch:2,travel:-.4},b:['구름 속 번개가 로켓을 때렸어','Lightning in the clouds hit the rocket'],real:['1969년 아폴로 12호는 발사 직후 번개를 두 번 맞았어. 다행히 우주비행사들이 시스템을 다시 켜서 살아남았어.','In 1969, Apollo 12 was hit by lightning twice just after launch. Luckily, the crew restarted the systems and survived.']}]},
{id:'test',ph:2,t:['시험','Testing'],ko:'발사 전에 얼마나 시험할까?',en:'How much testing before launch?',o:[
{v:'full',ko:'모든 걸 꼼꼼하게',en:'Test everything carefully',dk:'아주 비싸. 대신 숨은 문제를 미리 찾아내.',de:'Very costly. But it finds hidden problems early.',c:12,r:{launch:-1.5,travel:-.5,arrive:-1,ops:-.5},g:['꼼꼼한 시험 덕분에 숨은 문제를 미리 고쳐 뒀어','Careful testing fixed hidden problems before launch']},
{v:'basic',ko:'중요한 것만',en:'Only the important parts',dk:'적당한 돈, 적당한 안전.',de:'Medium cost, medium safety.',c:6},
{v:'skip',ko:'시험 생략',en:'Skip testing',dk:'돈을 많이 아껴. 하지만 숨은 실수가 그대로 남아.',de:'Saves a lot of money. But hidden mistakes stay hidden.',c:0,r:{launch:2,arrive:1.5,ops:1},b:['시험을 안 해서 숨은 실수가 터졌어','A hidden mistake appeared because nothing was tested'],real:['1999년 화성 극지 착륙선은 다리가 펴질 때의 흔들림을 땅에 닿은 것으로 착각해서, 너무 일찍 엔진을 끈 것으로 보여.','In 1999, the Mars Polar Lander probably mistook the shake of its legs opening for touchdown and shut off its engine too early.']}]},
{id:'route',ph:3,t:['경로','Route'],ko:'어떤 길로 날아갈까?',en:'Which path will it fly?',o:[
{v:'slow',ko:'연료를 넉넉히, 천천히',en:'Lots of fuel, slow and steady',dk:'실수해도 고칠 연료가 있어. 연료가 무거워.',de:'Extra fuel to fix mistakes. But fuel is heavy.',c:8,m:3,r:{travel:-.5},g:['넉넉한 연료로 길을 바로잡았어','Extra fuel let it fix its course']},
{v:'fast',ko:'연료를 아끼고 빠르게',en:'Save fuel and go fast',dk:'가볍고 싸. 하지만 실수할 여유가 없어.',de:'Light and cheap. But there is no room for mistakes.',c:3,m:1,r:{travel:2},mis:{europa:2},mt:{travel:1},b:['연료가 모자라서 길을 바로잡지 못했어','Too little fuel to fix the course']},
{v:'assist',ko:'다른 행성의 중력 빌리기',en:'Borrow a planet’s gravity',dk:'다른 행성 옆을 스치며 속도를 얻어. 먼 곳에 좋지만, 길을 아주 정확히 맞춰야 해.',de:'Swings past another planet to gain speed. Great for far trips, but it must be very precise.',c:5,m:2,r:{travel:1},mis:{moon:1.5},mt:{travel:1},b:['행성을 스치는 길이 조금 어긋났어','The swing past the planet went a little wrong']}]},
{id:'nav',ph:3,t:['길 찾기','Navigation'],ko:'길은 어떻게 찾을까?',en:'How will it find its way?',o:[
{v:'check',ko:'지구에서 추적 + 계산 두 번 확인',en:'Track from Earth + double-check the math',dk:'NASA의 심우주 통신망으로 위치를 재고, 다른 팀이 계산을 다시 확인해.',de:'NASA Deep Space Network tracks it, and a second team checks every number.',c:6,r:{travel:-1,arrive:-.5},g:['두 번 확인한 계산 덕분에 정확한 길로 날아갔어','Double-checked math kept it on the right path']},
{v:'track',ko:'지구에서 추적만',en:'Track from Earth only',dk:'돈을 아껴. 계산을 다시 확인하지는 않아.',de:'Saves money. Nobody checks the math again.',c:3,r:{travel:1.6},b:['계산 실수를 아무도 못 찾았어','Nobody caught a math mistake'],real:['1999년 화성 기후 궤도선은 한 팀은 미국식 단위, 다른 팀은 미터 단위를 써서 길을 잃고 사라졌어.','In 1999, the Mars Climate Orbiter was lost because one team used US units and another used metric units.']},
{v:'auto',ko:'탐사선이 스스로 길 찾기',en:'The spacecraft steers itself',dk:'별을 보고 스스로 위치를 계산해. 착륙엔 좋지만, 먼 길에선 작은 오차가 쌓여.',de:'It reads the stars and steers itself. Good for landing, but small errors add up on long trips.',c:5,r:{arrive:-.6},mis:{mars:.6,europa:1.5},mt:{travel:1},b:['먼 길에서 작은 오차가 쌓였어','Small errors added up on the long trip'],g:['스스로 길을 찾아 정확히 내려앉았어','It steered itself to a precise arrival']}]},
{id:'soft',ph:3,t:['소프트웨어','Software'],ko:'비행 중 소프트웨어에 문제가 생기면?',en:'If the software has a problem during flight?',o:[
{v:'careful',ko:'지구에서 시험한 뒤 고쳐 보내기',en:'Test on Earth, then send a fix',dk:'지구에 똑같은 쌍둥이 탐사선을 두고 먼저 시험해. 느리지만 안전해.',de:'Test on a twin spacecraft on Earth first. Slow, but safe.',c:4,r:{ops:-1,travel:-.3},g:['지구의 쌍둥이로 시험한 수정 프로그램이 잘 작동했어','The fix, tested on the twin on Earth, worked well']},
{v:'freeze',ko:'절대 바꾸지 않기',en:'Never change it',dk:'돈이 안 들어. 하지만 문제가 생겨도 고칠 수 없어.',de:'Costs nothing. But no problem can ever be fixed.',c:0,r:{ops:1.5},b:['소프트웨어 문제를 고칠 방법이 없었어','There was no way to fix the software problem'],real:['2004년 스피릿 로버는 착륙 18일 만에 메모리 문제로 계속 재부팅됐어. NASA가 지구에서 명령을 보내 고쳐서 살아났어.','In 2004, the Spirit rover kept rebooting from a memory problem just 18 days after landing. NASA fixed it by sending commands from Earth.']},
{v:'quick',ko:'바로바로 고쳐 보내기',en:'Send quick fixes right away',dk:'빠르고 싸. 하지만 급하게 만든 수정이 새 문제를 만들 수 있어.',de:'Fast and cheap. But a rushed fix can make new problems.',c:1,r:{ops:.6,travel:.8},b:['급하게 보낸 수정 프로그램이 새 문제를 만들었어','A rushed fix caused a new problem']}]},
{id:'arrive',ph:4,t:['도착 방법','Arrival'],ko:'목적지에 어떻게 내려갈까?',en:'How will it arrive?',ok:'궤도에 어떻게 들어갈까?',oe:'How will it enter orbit?',o:[
{v:'air',ko:'공기로 속도 줄이기 (낙하산·공기 브레이크)',en:'Use the air to slow down (parachute, air brake)',dk:'연료를 거의 안 써서 가볍고 싸.',de:'Uses almost no fuel, so it is light and cheap.',c:3,m:1,mis:{moon:6,europa:6},mt:{arrive:1},b:['공기가 거의 없어서 낙하산이 아무 소용 없었어','There was almost no air, so the parachute did nothing'],real:['달과 유로파에는 공기가 거의 없어. 그래서 아폴로 달 착륙선은 낙하산 없이 엔진만으로 내려갔어.','The Moon and Europa have almost no air. That is why the Apollo lunar module landed with engines only.']},
{v:'retro',ko:'엔진을 거꾸로 뿜기',en:'Fire the engine backward',dk:'어디서나 쓸 수 있어. 연료가 꽤 무거워.',de:'Works anywhere. The fuel is fairly heavy.',c:6,m:2,r:{arrive:.4},b:['엔진으로 속도를 줄이다 연료가 모자랐어','It ran low on fuel while braking']},
{v:'precise',ko:'레이더 + 정밀 유도 장치',en:'Radar + precision guidance',dk:'레이더로 땅을 보며 위험한 곳을 피해. 제일 비싸지만 제일 안전해.',de:'Uses radar to see and avoid danger. Most costly, but safest.',c:12,m:2,r:{arrive:-1.5},g:['레이더가 위험한 곳을 피해 안전하게 이끌었어','Radar guided it safely away from danger']}]},
{id:'site',ph:4,t:['장소','Site'],ko:'어디에 내려앉을까?',en:'Where will it land?',ok:'얼마나 낮게 돌까?',oe:'How low will it orbit?',o:[
{v:'safe',ko:'평평하고 안전한 평원',en:'A flat, safe plain',dk:'내려앉기 쉬워. 대신 흥미로운 건 별로 없어.',de:'Easy to land. But not much to discover.',ko2:'높은 궤도',en2:'High orbit',dk2:'안전하지만 멀어서 흐릿하게 보여.',de2:'Safe, but too far to see details.',s:0,r:{arrive:-.8},g:['안전한 곳을 골라서 쉽게 도착했어','Picking a safe spot made arrival easy']},
{v:'mid',ko:'적당한 곳',en:'A middle choice',dk:'안전함과 과학 사이의 균형.',de:'A balance of safety and science.',ko2:'중간 궤도',en2:'Middle orbit',dk2:'안전함과 선명함 사이의 균형.',de2:'A balance of safety and detail.',s:1,r:{arrive:.3}},
{v:'rough',ko:'바위투성이 계곡 (과학의 보물창고)',en:'A rocky canyon (a science treasure)',dk:'발견할 게 가득해. 하지만 바위에 부딪힐 수 있어.',de:'Full of discoveries. But it might hit a rock.',ko2:'아주 낮은 궤도',en2:'Very low orbit',dk2:'아주 자세히 보여. 하지만 산에 부딪히거나 떨어질 수 있어.',de2:'Amazing detail. But it could hit a mountain or fall.',s:2,r:{arrive:2},b:['험한 지형에 부딪혔어','It hit rough ground'],real:['1969년 아폴로 11호의 암스트롱은 바위밭을 피하느라 직접 조종했고, 연료가 거의 다 떨어졌을 때 겨우 내려앉았어.','In 1969, Armstrong flew Apollo 11 by hand to avoid a field of boulders and landed with very little fuel left.']}]},
{id:'ops',ph:4,t:['탐사 방식','Science plan'],ko:'도착한 뒤 어떻게 탐사할까?',en:'How will you explore after arriving?',o:[
{v:'cautious',ko:'조심조심, 천천히',en:'Carefully and slowly',dk:'위험한 건 안 해. 대신 발견도 적어.',de:'No risky moves. But fewer discoveries.',s:0,r:{ops:-.8},g:['조심스럽게 움직여서 장비를 지켰어','Careful work kept the tools safe']},
{v:'balanced',ko:'균형 있게',en:'Balanced',dk:'적당히 도전하고 적당히 조심해.',de:'Some risk, some care.',s:1},
{v:'bold',ko:'최대한 많이, 과감하게',en:'Do as much as possible, boldly',dk:'발견이 엄청 많아져. 하지만 무리하다 고장 날 수 있어.',de:'Many more discoveries. But pushing too hard can break things.',s:2,r:{ops:2},b:['너무 무리하다가 탐사선이 망가졌어','It pushed too hard and broke down'],real:['2009년 스피릿 로버는 부드러운 모래에 바퀴가 빠져서 다시는 움직이지 못했어.','In 2009, the Spirit rover got its wheels stuck in soft sand and never moved again.']}]},
{id:'ret',ph:5,t:['열 방패','Heat shield'],ko:'지구로 어떻게 돌아올까?',en:'How will the data come home?',o:[
{v:'thick',ko:'캡슐 + 두꺼운 열 방패',en:'Capsule + thick heat shield',dk:'대기권에 들어올 때 3000도의 열을 버텨. 무겁고 비싸.',de:'Survives the 3000-degree heat of re-entry. Heavy and costly.',c:8,m:2,g:['두꺼운 열 방패가 불덩이 같은 열을 버텼어','The thick shield survived the fiery heat']},
{v:'thin',ko:'캡슐 + 얇은 열 방패',en:'Capsule + thin heat shield',dk:'가볍고 싸. 하지만 타 버릴 수 있어.',de:'Light and cheap. But it might burn up.',c:3,m:1,r:{ret:3},b:['얇은 열 방패가 대기권의 열에 타 버렸어','The thin shield burned up in the atmosphere']},
{v:'none',ko:'돌아오지 않고 데이터만 보내기',en:'No return, just send data',dk:'제일 싸. 하지만 탐사선은 영원히 그곳에 남아.',de:'Cheapest. But the craft stays there forever.',c:0,m:0,noret:true}]},
{id:'recov',ph:5,t:['착지','Landing'],ko:'캡슐을 어떻게 받을까?',en:'How will you catch the capsule?',o:[

function loop(now){

function powerAt(m,tt){let p=100;for(const e of m.ev){if(e.t<=tt)p=e.p;else break;}return p;}
function dormAt(m,tt){let z=0;for(const e of m.ev){if(e.t<=tt)z=e.z?1:0;else break;}return z;}

function pal(z){return z?{b:'#8d877f',pn:'#5c5a58',d:'#4a4744',g:'#8f7f60',s:'#5f6b78'}:{b:'#e8e4dc',pn:'#2b4d7e',d:'#2f2f2f',g:'#c9a227',s:'#3d4f6b'};}
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h);}

function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function circ(c,cx,cy,r,col){for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));R(c,cx-w,cy+y,w*2+1,1,col);}}
function ell(c,cx,cy,rx,ry,col){for(let y=-ry;y<=ry;y++){const w=Math.floor(rx*Math.sqrt(1-(y*y)/(ry*ry)));R(c,cx-w,cy+y,w*2+1,1,col);}}
function stars(c,n,seed,W,H,col){const r=rnd(seed);for(let i=0;i<n;i++)R(c,Math.floor(r()*W),Math.floor(r()*H),1,1,col);}
const SPW={rover:14,heli:8,lander:16,lrv:17,orbiter:23,probe:13,telescope:11,lm:16,alsep:21,surveyor:16,sojourner:10,phoenix:16,insight:27,near:18};
function drawScene(){
const m=S.m,cv=$('#scene'),c=cv.getContext('2d'),W=192,H=72,G=58,z=dormAt(m,S.t)||S.done,tt=S.t;
c.clearRect(0,0,W,H);
const k=m.kind,brk=m.id==='ingenuity'&&z,sx0=Math.round(96-SPW[k]/2);
if(m.body==='mars'){
const polar=m.id==='phoenix';
R(c,0,0,W,G,z?'#c99c7a':'#e2b48c');R(c,0,0,W,18,z?'#bf9070':'#d9a37c');
const sx=10+((tt*37)%1)*170;circ(c,Math.round(sx),12,2,'#f6ead2');
for(let x=0;x<W;x+=4){const h=4+Math.round(3*Math.sin(x*0.08)+2*Math.sin(x*0.21));R(c,x,G-h,4,h,'#c97a52');}
R(c,0,G,W,H-G,'#b65a32');R(c,0,G+4,W,2,'#a24d29');R(c,0,G+9,W,1,'#a24d29');
const r=rnd(7);for(let i=0;i<14;i++)R(c,Math.floor(r()*W),G+1+Math.floor(r()*12),2+Math.floor(r()*2),1+Math.floor(r()*2),'#7a3a20');
if(polar){for(let x=0;x<W;x+=16)R(c,x,G+1,1,13,'#9a4a28');R(c,0,G+7,W,1,'#9a4a28');}
if(polar&&z){R(c,0,G,W,3,'#efe9e2');}
if(m.id==='viking2'&&tt>=m.ev[4].t){const r2=rnd(3);for(let i=0;i<60;i++)R(c,Math.floor(r2()*W),G+Math.floor(r2()*13),1,1,'#f2ece6');}
if(z)for(let i=0;i<40;i++)R(c,Math.floor(r()*W),Math.floor(r()*G),1,1,'#d8b292');
const off=k==='heli'?(z?0:Math.round(-6-3*Math.sin(performance.now()/300))):0;
sprite(c,k,sx0+(k==='sojourner'?12:0),G+1+off,z,brk);
}else if(m.body==='moon'){
R(c,0,0,W,H,'#06080b');stars(c,60,3,W,G,'#c9d3dc');circ(c,160,14,6,'#3f7dbf');R(c,157,11,4,2,'#e8eef2');R(c,161,16,3,2,'#5f9a55');
R(c,0,G-3,W,H-G+3,'#8f8e88');R(c,0,G+3,W,2,'#7b7a75');
for(let x=0;x<W;x+=6){const h=2+Math.round(2*Math.sin(x*0.13));R(c,x,G-3-h,6,h,'#787772');}
[[30,G+6,5],[130,G+9,4],[170,G+5,3]].forEach(q=>{R(c,q[0]-q[2],q[1],q[2]*2,2,'#6b6a66');R(c,q[0]-q[2]+1,q[1]+2,q[2]*2-2,1,'#a3a29c');});
sprite(c,k,sx0,G+1,z);
if(!S.done&&!z&&m.id==='lrv15'&&tt<6&&tt>=m.ev[1].t){R(c,36,G-7,8,5,'#d8c27a');R(c,38,G-12,4,5,'#cfcfcf');}
}else{
R(c,0,0,W,H,'#05070a');stars(c,120,11,W,H,'#9fb0bf');stars(c,25,5,W,H,'#ffffff');
let sy=42;
if(m.id==='dawn'){const tc=m.ev[4].t,tv=m.ev[2].t;if(tt>=tc-0.2)circ(c,96,128,72,'#6b6862');else if(tt>=tv-0.2&&tt<m.ev[3].t+0.4)circ(c,96,118,60,'#857b6c');else circ(c,20+Math.round(tt*8)%150,60,3,'#c86b45');}
if(m.id==='pioneer10'||m.id==='pioneer11'){const sr=Math.max(1,Math.round(6-tt*0.3));circ(c,18,36,sr,'#ffd76a');const jt=m.ev[m.id==='pioneer10'?2:1].t;if(Math.abs(tt-jt)<0.8){const jx=Math.round(150-(tt-jt)*60);circ(c,jx,40,18,'#c9a27a');R(c,jx-17,35,35,2,'#a8794f');R(c,jx-16,43,33,2,'#a8794f');}
if(m.id==='pioneer11'){const st=m.ev[2].t;if(Math.abs(tt-st)<1){const kx=Math.round(150-(tt-st)*50);ell(c,kx,40,26,4,'#bfae8a');circ(c,kx,40,12,'#e2cf9e');R(c,kx-11,38,23,1,'#c9b383');R(c,kx-26,40,52,1,'#8f8160');}}}
if(m.id==='kepler'){const ex=Math.round(170+Math.min(15,tt*1.5));circ(c,ex,56,2,'#3f7dbf');}
if(m.id==='near'){const ot=m.ev[3].t,lt=m.ev[5].t;if(tt>=ot-0.1){ell(c,96,82,90,34,'#7d7465');ell(c,70,60,14,4,'#6a6255');ell(c,130,64,10,3,'#6a6255');sy=tt>=lt?50:30;}else{ell(c,40+Math.round((tt*30)%120),58,6,3,'#7d7465');}}
const bob=tt>=(m.id==='near'?m.ev[5].t:1e9)?0:Math.round(Math.sin(performance.now()/700));
sprite(c,k,sx0,(k==='telescope'?50:sy)+bob,z);
}
$('#scene-cap').textContent=X(m).cap+(S.done?(L==='ko'?' · 지금':' · Today'):'');
}
